name: Deploy Update Server

on:
  push:
    branches: [main]
    paths:
      - "apps/updates/**"
  workflow_dispatch:

concurrency:
  group: updates-deploy

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/updates/package-lock.json

      - name: Install
        working-directory: apps/updates
        run: npm ci

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: apps/updates
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
