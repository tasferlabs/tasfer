name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      desktop_release_created: ${{ steps.release.outputs['apps/desktop--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

      # The release goes out live on the latest channel — no draft to un-hide.
      # release-please writes its own conventional-commit changelog into the
      # body; replace it with GitHub's auto-generated notes, which credit
      # contributors and link the PRs.
      - name: Use GitHub's generated release notes
        if: steps.release.outputs['apps/desktop--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs['apps/desktop--tag_name'] }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body \
            | gh release edit "$TAG" --repo "$REPO" --draft=false --latest --notes-file -

  native-release:
    needs: release-please
    if: needs.release-please.outputs.desktop_release_created == 'true'
    # No tag is passed: the called workflow builds this same release commit and
    # reads v<appVersion> from version.json, which release-please just bumped.
    uses: ./.github/workflows/native-release.yml
    with:
      publish: true
    secrets: inherit
    permissions:
      contents: write
