name: Native Release

# Desktop (Electron) builds for macOS/Windows/Linux. iOS/Android store
# submissions run via the Store Release workflow (fastlane), dispatched
# manually after release notes are curated; they ship the same v<version>
# this workflow builds.

# There is no tag input: the build always uses the ref it was triggered on, and
# the release tag is `v<appVersion>` read from version.json at that ref. So the
# flow is to bump appVersion, merge, then dispatch on that ref.
#
# The normal path is the Release workflow, which cuts the release first and
# calls this and the CLI build on the same ref, so both land in `v<appVersion>`
# from one commit. Dispatching this alone still works and is how a failed
# desktop build is re-run without rebuilding the CLI — `prepare` cuts the
# release when it is missing and falls through when Release already did.
#
# workflow_dispatch with publish=false is a safe dry run: full signed build,
# artifacts uploaded to the workflow run instead of a release.
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to the v<appVersion> GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # electron-builder must never be the one to create the release. With no
  # release to upload into it builds one publisher per artifact, each racing to
  # POST /releases; the loser dies with 422 "Published releases must have a
  # valid tag" and strands every asset it owns — v0.1.3 shipped with a single
  # blockmap that way. Its POST also tags whatever the default branch points at
  # rather than the commit being built. Creating the release up front, once,
  # leaves every publisher on the plain lookup path.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure the v<appVersion> release exists
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(node scripts/release/app-version.mjs)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$tag already exists — the build will upload into it"
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "${tag#v}" --generate-notes --latest

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          # Windows is off until code signing is sorted out. An unsigned
          # installer hands every visitor a SmartScreen warning, and the
          # publisher name is baked into each client's app-update.yml — so the
          # first signed release must already carry the identity we intend to
          # keep. See dev-docs/desktop-release.md.
          # - os: windows-latest
          #   platform: win
          # Linux is off as well. The download page links no Linux asset —
          # DownloadPage.tsx keeps its card and `linux*` FILES entries
          # commented out — so this runner was publishing AppImage/deb/pacman
          # that nothing pointed at. Uncomment here and restore that card
          # together.
          # - os: ubuntu-latest
          #   platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
            packages/*/package-lock.json

      # web's postinstall also installs the source-aliased packages/*
      - name: Install
        run: |
          (cd apps/web && npm ci)
          (cd apps/desktop && npm ci)

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Build Electron
        working-directory: apps/desktop
        run: npm run build

      # Notarization reuses the App Store Connect API key the store release
      # already uses, so the desktop pipeline needs no separate Apple ID and
      # app-specific password. All three values must be exported together —
      # electron-builder fails the build on a partial set, but skips
      # notarization entirely (with a warning) when none of them are present,
      # which is what an unsigned dry run wants.
      - name: Write App Store Connect API key
        if: matrix.platform == 'mac'
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${ASC_KEY_CONTENT:-}" || -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" ]]; then
            echo "::notice::App Store Connect API key secrets are incomplete — the macOS build will not be notarized"
            exit 0
          fi

          key_path="$RUNNER_TEMP/AuthKey.p8"
          if ! printf '%s' "$ASC_KEY_CONTENT" | base64 -d > "$key_path"; then
            echo "::error::ASC_KEY_CONTENT is not valid base64"
            exit 1
          fi
          if ! openssl pkey -in "$key_path" -check -noout >/dev/null 2>&1; then
            echo "::error::ASC_KEY_CONTENT does not decode to a valid App Store Connect .p8 private key"
            exit 1
          fi

          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Package
        working-directory: apps/desktop
        run: npm run package -- --${{ matrix.platform }} --publish ${{ inputs.publish && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder refuses to upload into a release published more
          # than two hours ago, warning instead of failing — a re-run of a
          # half-published release would look green and upload nothing.
          EP_GH_IGNORE_TIME: "true"
          # macOS code signing — a Developer ID Application certificate. Absent,
          # electron-builder still produces the artifacts, but unsigned: macOS
          # refuses to launch them and the updater cannot install them.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing — re-enable with the win matrix entry above.
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload artifacts (dry run)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.*
            !apps/desktop/release/builder-*.yml
